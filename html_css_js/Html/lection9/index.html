    <h1>Complex form</h1>
    <form>
      <fieldset>
        <legend>Personal Information</legend>
        <label for="name">Name</label>
        <input type="text" name="" id="name" />
        <label for="email">Email</label>
        <input type="text" name="" id="email" />
        <label for="phone">Phone</label>
        <input type="text" name="" id="phone" />
        <label for="dob">Date of Birth</label>
        <input type="date" name="" id="dob" />
        <label for="gender">Gender</label>
        <label for="male">male</label>
        <input type="radio" name="gender" id="male" />
        <label for="female">male</label>
        <input type="radio" name="gender" id="female" />
        <label for="country">Country</label>
        <select name="" id="country">
          <option value="India">India</option>
          <option value="dubai">dubai</option>
          <option value="usa">USA</option>
        </select>
      </fieldset>
      <br>
      <fieldset>
            <legend>Address</legend>
            <label for="street">Street</label>
            <input type="text" name="" id="street">
            <label for="city">City</label>
            <input type="text" name="" id="city">
            <label for="state">State</label>
            <input type="text" name="" id="state">
            <label for="zipcode">Zip Code</label>
            <input type="number" name="" id="zipcode">
      </fieldset>
      <br>
      <fieldset>
            <legend>Other Information</legend>
            <label for="comments">Comments</label>
            <textarea name="" id="comments"></textarea><br><br>
            <input type="checkbox" name="" id="agree">
            <label for="agree">I agree the terms and conditions</label>
      </fieldset><br>
      <input type="submit" name="submit" id="">
    </form>
