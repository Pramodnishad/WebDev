<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .container {
        height: 100vh;
        width: 100vw;
        background-color: beige;
        border: 1px solid black;
      }
      .box {
        height: 100px;
        width: 300px;
        background-color: blueviolet;
        border-radius: 10px;
        margin: 10px;
        border: 2px solid yellow;
        position: relative;
        /* animation-name: rightMovement;
        animation-duration: 5s;
        animation-delay: 1s; */
        /* animation-iteration-count: infinite; */
        /* animation-timing-function: linear; */
        /* animation-direction: alternate; */
        /* animation-fill-mode: forwards; */

        /* Short hand notation */
        animation: 5s linear 1s infinite alternate rightMovement;
      }
      @keyframes rightMovement {
        from {
          top: 0;
          left: 0;
        }
        to {
          top: 0px;
          left: 1200px;
        }
      }
      .box2 {
        height: 100px;
        width: 300px;
        background-color: blueviolet;
        border-radius: 10px;
        margin: 10px;
        border: 2px solid yellow;
        position: relative;
        animation: 5s linear 1s infinite alternate leftMovement;
      }
      @keyframes leftMovement {
        from {
          top: 600px;
          left: 1200px;
        }
        to {
          top: 600px;
          left: 0;
        }
      }
      .circle {
        height: 100px;
        width: 100px;
        background-color: blueviolet;
        border-radius: 50px;
        margin: 10px;
        border: 2px solid yellow;
        position: relative;
        top: 300px;
        animation: 10s linear 0s infinite alternate cirlceMovement;
      }
      @keyframes cirlceMovement {
        0% {
          top: 1%;
          left: 10%;
        }
        30% {
          top: 50%;
          left: 85%;
        }
        60% {
          top: 70%;
          left: 10%;
        }
        100% {
          top: 10%;
          left: 10%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box"></div>
      <div class="circle"></div>
      <div class="box2"></div>
    </div>
  </body>
</html>
