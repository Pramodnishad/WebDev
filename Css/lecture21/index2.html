<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        background-color: aqua;
        border: 2px solid black;
        display: flex;
        width: 600px;
      }
      .leftBox {
        background-color: yellowgreen;
        border: 2px solid brown;
        width: 47%;
        margin: 10px;
        padding: 2px;
        display: flex;
        flex-direction: column;
      }
      .rightBox {
        background-color: rebeccapurple;
        border: 2px solid tan;
        width: 47%;
        margin: 10px;
        padding: 2px;
      }
      p{
        border: 2px solid red;
        margin: 2px;
        padding: 2px;
      }
      @media (max-width:640px) {
        .container{
            flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="leftBox">
        <p>hello heading 1</p>
        <p>hello heading 2</p>
      </div>
      <div class="rightBox">
        <img src="rana.jpg" alt="" />
      </div>
    </div>
  </body>
</html>
