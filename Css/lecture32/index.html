<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        height: 100vh;
        width: 100vw;
      }
      .container {
        display: grid;
        gap: 2rem;
        /* grid-template-columns: repeat(auto-fit, minmax(200px , 500px)); */
        grid-template-columns: repeat(3,1fr);
        padding: 5rem;
        justify-content: center;
        align-items: center;
      }
      .item {
        height: 250px;
        width: 250px;
        background-color: rgb(139, 101, 255);
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #rotateX:hover{
        transform: rotateX(45deg);
      }
      #rotateY:hover{
        transform: rotateY(45deg);
      }
      #rotateZ:hover{
        transform: rotateZ(45deg);
      }
      #translateX:hover{
        transform: translateX(100px);
      }
      #translateY:hover{
        transform: translateY(100px);
      }
      #translateZ:hover{
        transform:perspective(200px) translateZ(-100px);
      }
      #scaleX:hover{
        transform: scaleX(1.5);
      }
      #scaleY:hover{
        transform: scaleY(1.5);
      }
      #scaleZ:hover{
        transform: perspective(200px) rotateY(45deg) scaleZ(1.5);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item" id="rotateX">RotateX</div>
      <div class="item" id="rotateY">RotateY</div>
      <div class="item" id="rotateZ">RotateZ</div>
      <div class="item" id="translateX">TranslateX</div>
      <div class="item" id="translateY">TranslateY</div>
      <div class="item" id="translateZ">TranslateZ</div>
      <div class="item" id="scaleX">ScaleX</div>
      <div class="item" id="scaleY">ScaleY</div>
      <div class="item" id="scaleZ">ScaleZ</div>
    </div>
  </body>
</html>
